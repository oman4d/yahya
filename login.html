<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
  <style>
    body {
      background: #0d1b3d;
      color: white;
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }
    input {
      padding: 10px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #1e90ff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #1878d1;
    }
  </style>
</head>
<body>

  <h2>🔐 أدخل كلمة المرور للدخول</h2>
  <input type="password" id="pass" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>

  <script>
    const correctPass = "123321"; // ← ضع كلمة المرور هنا

    function login() {
      const p = document.getElementById('pass').value.trim();
      if (p === correctPass) {
        localStorage.setItem("auth", "ok");
        window.location.href = "index.html";
      } else {
        alert("❌ كلمة المرور غير صحيحة");
      }
    }
  </script>

</body>
</html>
